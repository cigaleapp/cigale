# yaml-language-server: $schema=../../static/protocol.schema.json

manifest: v1.0
id: io.github.cigaleapp.base.birds
name: Oiseaux (base)

version: 1
updates: automatic

source: http://localhost:3000/bases/birds.cigaleprotocol.yaml

usable: false
summary: Protocole de base pour les oiseaux
description: Protocole de base pour les oiseaux

authors:
  - name: GBIF Contributors
    email: info@gbif.org
  - name: Jessica Joachim
    email: tifaeriis@gmail.com
  - name: Gwenn Le Bihan
    email: gwenn.lebihan7@gmail.com
  - name: Maxime Cauchoix
  - name: Léo Chekir

metadataGroups:
  taxonomy:
    name: Taxonomie
    description: Classification taxonomique de l'espèce
    # TODO: order here!

metadata:
  crop:
    type: boundingbox
    label: ''
    required: true
    description: ''
    mergeMethod: union
    groupable: true
    infer:
      neural: []
      # TODO
      #   - input:
      #       height:
      #       normalized:
      #       width:
      #     model:
      #     output:
      #       normalized:
      #       shape:
      #         -
      #     webgpuReady: false

  species:
    type: enum
    label: Espèce
    required: true
    description: ''
    mergeMethod: max
    groupable: true
    externalOptions:
      - at: http://localhost:3000/options/birds/species.jsonl
        format: json-lines
    infer:
      neural: []
        # TODO: add once we have audio support (see #2299)
        # - name: BirdNet+ 3 DP3.1
        #   model: https://zenodo.org/records/20703646/files/BirdNET+_V3.0-preview3.1_Global_11K_FP16.onnx?download=1
        #   # this one is a bit big, theres also a pruned version
        #   requirements:
        #     ram: 4 GB
        #   # TODO: use the classmapping's ids via extraKeys once we know that they'll be stable
        #   # cuz we rely on them being stable cuz options generation and classmapping installation are
        #   # done very separately (classmapping is installed at model loading time, and options generation relies
        #   # on protocols-server + the user updating the protocol)
        #   classes: labels
        #   classmapping:
        #     at: https://zenodo.org/records/20703646/files/BirdNET+_V3.0-preview3.1_Global_11K_Labels.csv?download=1
        #     format: csv-semicolons
        #     postprocess: |
        #       {
        #         "neuron": $number(line.idx),
        #         "value": line.sci_name
        #       }

        # - name: BirdNet+ 3 DP3.1 Pruned
        #   model: https://zenodo.org/records/20703646/files/BirdNET+_V3.0-preview3.1_Global_11K_FP16_pruned.onnx?download=1
        #   classes: labels
        #   classmapping:
        #     at: https://zenodo.org/records/20703646/files/BirdNET+_V3.0-preview3.1_Global_11K_Labels.csv?download=1
        #     format: csv-semicolons
        #     postprocess: |
        #       {
        #         "neuron": $number(line.idx),
        #         "value": line.sci_name
        #       }

  kingdom:
    type: enum
    group: taxonomy
    label: Règne
    required: true
    description: ''
    mergeMethod: max
    groupable: true
    externalOptions:
      - at: http://localhost:3000/options/birds/kingdom.jsonl
        format: json-lines

  phylum:
    type: enum
    group: taxonomy
    label: Phylum
    required: true
    description: ''
    mergeMethod: max
    groupable: true
    externalOptions:
      - at: http://localhost:3000/options/birds/phylum.jsonl
        format: json-lines

  class:
    type: enum
    group: taxonomy
    label: Classe
    required: true
    description: ''
    mergeMethod: max
    groupable: true
    externalOptions:
      - at: http://localhost:3000/options/birds/class.jsonl
        format: json-lines

  order:
    type: enum
    group: taxonomy
    label: Ordre
    required: true
    description: ''
    mergeMethod: max
    groupable: true
    externalOptions:
      - at: http://localhost:3000/options/birds/order.jsonl
        format: json-lines

  family:
    type: enum
    group: taxonomy
    label: Famille
    required: true
    description: ''
    mergeMethod: max
    groupable: true
    externalOptions:
      - at: http://localhost:3000/options/birds/family.jsonl
        format: json-lines

  genus:
    type: enum
    group: taxonomy
    label: Genre
    required: true
    description: ''
    mergeMethod: max
    groupable: true
    externalOptions:
      - at: http://localhost:3000/options/birds/genus.jsonl
        format: json-lines

  identification_difficulty:
    type: enum
    label: Difficulté didentification
    description: Niveau de difficulté pour identifier l'espèce
    required: false
    mergeMethod: average
    groupable: true
    sortable: true
    options:
      - key: easy
        label: Facile
        color: '#367517'
        icon: ri:emotion-laugh-line
      - key: medium
        label: Moyenne
        color: '#e8e819'
        icon: ri:emotion-happy-line
      - key: hard
        label: Difficile
        color: '#dd8808'
        icon: ri:emotion-normal-line
      - key: very_hard
        label: Très difficile
        color: '#cd3c28'
        icon: ri:emotion-unhappy-line

  conservation_status:
    type: enum
    label: Statut de conservation
    description: Statut de conservation IUCN de l'espèce
    required: false
    mergeMethod: average
    groupable: true
    sortable: true
    options:
      - key: ex
        label: EX
        description: Éteint (“Extinct”)
        color: '#000000'
      - key: ew
        label: EW
        description: Éteint à l’état sauvage (“Extinct in the Wild”)
        color: '#3a3a3a'
      - key: cr
        label: CR
        description: En danger critique d’extinction (“Critically Endangered”)
        color: '#cd3030'
      - key: en
        label: EN
        description: En danger (“Endangered”)
        color: '#cd6630'
      - key: vu
        label: VU
        description: Vulnérable (“Vulnerable”)
        color: '#cd9a00'
      - key: nt
        label: NT
        description: Quasi menacé (“Near Threatened”)
        color: '#006666'
      - key: lc
        label: LC
        description: Préoccupation mineure (“Least Concern”)
        color: '#16ca85'

  shoot_date:
    type: date
    label: Date
    description: Moment de l'observation
    required: false
    mergeMethod: average
    sortable: true
    groupable: true
    infer: { exif: DateTimeOriginal }

  shoot_location:
    type: location
    label: Localisation
    description: Endroit de l'observation
    required: false
    mergeMethod: average
    groupable: true
    infer:
      latitude: { exif: GPSLatitude }
      longitude: { exif: GPSLongitude }
