    images:
      [
        https://cors.gwen.works/www.terroiko.fr/sites/default/files/inline-images/PSIBIOM%20logo%20%28fond%20noir%29.jpg,
      ]
    description: ''
    mergeMethod: min
    required: true
    default: false

  is_renat:
    type: boolean
    group: project
    label: RENAT
    kobocollect:
      list: Code projet
      choice: renat
    learnMore: https://renat.wiki/
    images: [https://renot.gogocarto.fr/uploads/renot/images/config/logo-fond-blanc.png]
    description: Parc Naturel Régional des Pyrénées Ariégeoises
    mergeMethod: min
    required: true
    default: false

  is_adept:
    type: boolean
    group: project
    label: ADEPT
    kobocollect:
      list: Code projet
      choice: adept
    learnMore: https://fundatia-adept.org/projects/
    images:
      [
        https://cors.gwen.works/fundatia-adept.org/wp-content/uploads/2018/02/logo-transparent-adept.png,
