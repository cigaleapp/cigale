    required: true
    description: ''
    infer:
      capture: before-timer

  is_training:
    type: boolean
    group: project
    label: Entraînement
    kobocollect:
      list: Code projet
      choice: entrainement
    description: ''
    mergeMethod: min
    required: true
    default: false

  is_citizen_science:
    type: boolean
    group: project
    label: Sciences participatives
    kobocollect:
      list: Code projet
      choice: sciences_participatives
    description: ''
    mergeMethod: min
    required: true
    default: false

  is_psibiom:
