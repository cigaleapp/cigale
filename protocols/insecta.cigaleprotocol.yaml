  site_code:
    type: string
    label: Code du site
    description: Dépend du projet. Si vous ne faites pas le protocole dans le cadre d'un projet spécifique le nom de la commune ou de tout autre repère spatial est suffisant
    mergeMethod: none
    required: false
    # kobocollect: Code du site # defaults to matching by label

  habitat:
    type: enum
    label: Habitat
    description: Type d'habitat, selon la catégorisation CarHab
    learnMore: https://researchgate.net/publication/374783237_Notice_CarHab_-_Programme_de_cartographie_nationale_des_habitats_naturels_et_semi-naturels
    mergeMethod: none
    required: false
    options:
      - key: '1100'
        label: Glacier et névé
        description: 'Physionomie dominée par la glace et/ou la neige. S’observe uniquement aux étages alpin et nival. Inclut les surfaces recouvertes de glace toute l’année (glaciers blancs, glaciers noirs, glaciers rocheux) et les surfaces dépourvues de glace, mais recouvertes de neige en dehors de la période hivernale (névés temporaires, névés permanents).'
        color: '#e0ffff'
      - key: '2100'
        label: Minéral végétalisé
        description: 'Physionomie peu couverte par la végétation, dominée par le substrat minéral nu ou par une végétation très clairsemée. Les végétations herbacées plus denses et ligneuses apparaissent par plages mais elles laissent une place significative au substrat nu. S’observe typiquement en situation d’éboulis, de dalles rocheuses, de parois, de falaises, de grèves exondées des rivières et plans d’eau, sur les estrans. Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. C’est une physionomie « complexe » issue uniquement d’un calcul : elle est déduite par analyse de la physionomie majoritaire et de la part des autres physionomies exprimées dans le polygone (pelouses, prairies, végétation herbacée haute, etc.).'
        color: '#b3a985'
      - key: '2200'
        label: Minéral non ou peu végétalisé
        description: 'Physionomie très peu couverte par la végétation, hormis une végétation cryptogamique très éparse et une végétation herbacée très clairsemée pratiquement indétectables par analyse d’images satellite. Les végétations pionnières apparaissent par plages mais elles sont de très faible densité. S’observe typiquement en situation d’éboulis, de dalles rocheuses, de parois, de falaises, de grèves grèves exondées des rivières et plans d’eau, sur les estrans. Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle est déduite de la physionomie majoritaire.'
        color: '#d5d2b0'
      - key: '3100'
        label: Pelouse
        description: 'Physionomie dominée par une végétation herbacée vivace naturellement basse, à faible production de biomasse due à des conditions édaphiques pauvres en éléments nutritifs (milieu oligotrophe, sècheresse, etc.) ou à des conditions climatiques défavorables à l’activité photosynthétique (températures très basses, photopériode courte, etc.). Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle correspond à la physionomie majoritaire.'
        color: '#94e346'
      - key: '3200'
        label: Végétation herbacée haute
        description: 'Physionomie dominée par une végétation herbacée vivace naturellement élevée, à forte production de biomasse, dont les espèces ont généralement un port ramifié, avec des feuilles caulinaires nombreuses et une inflorescence souvent de grande taille. La formation végétale typique est l’ourlet au sens large, incluant mégaphorbiaies, roselières et cariçaies. Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle est déduite de la physionomie majoritaire.'
        color: '#02e263'
      - key: '3300'
        label: Prairie de type indéterminé
        description: 'Physionomie dominée par une végétation herbacée vivace à production de biomasse moyenne à forte due à des conditions édaphiques peu contraignantes, mais au développement vertical contraint par les activités agropastorales (fauche, pâturage).'
        color: '#a8de89'
      - key: '3301'
        label: Prairie fauchée
        description: 'Prairie dont le développement vertical est contraint par l’activité de fauche. La fauche produit des paysages assez homogènes à l’échelle parcellaire, avec peu de végétations associées à la végétation prairiale sensu stricto. Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle est déduite de la physionomie ma-joritaire.'
        color: '#c3e86c'
      - key: '3302'
        label: Prairie pâturée
        description: 'Prairie dont le développement vertical est contraint par l’activité de pâturage. Le pâturage produit des paysages hétérogènes à l’échelle parcellaire, avec des entrées de pâture hébergeant des végétations piétinées, des reposoirs à bétail dont la végétation est celle d’une friche nitrophile, des abreuvoirs aux végétations aquatiques et amphibies, des rochers, des fourrés ponctuels, etc. Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle est déduite de la physionomie ma-joritaire.'
        color: '#caffae'
      - key: '4100'
        label: Fourré bas
        description: 'Physionomie dominée par une végétation de chaméphytes (landes, garrigues basses etc.), dans des conditions contraignantes d’un point de vue édaphique (pauvreté en nutriments, sécheresse, salinité) ou climatique (températures très basses, photopériode courte, etc.). Les végétations chaméphytiques succulentes des estuaires (notamment à salicornes pérennes) font partie de cette catégorie. Les autres types de physionomies, quand ils sont présents, sont généralement des fourrés pionniers, des pelouses et du substrat minéral non végétalisé. Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle est déduite de la physionomie ma-joritaire.'
        color: '#83a729'
      - key: '4200'
        label: Fourré haut mixte
        description: 'Physionomie mixte, associant des végétations herbacées hautes et des végéta-tions arbustives, et parfois d’autres végétations (souvent des végétations de pelouses ou de prairies, des fourrés bas, des éléments ponctuels de forêt pionnière etc.). C’est une physionomie issue uniquement par calcul. Elle est déduite par analyse de la physionomie majoritaire et de la part des autres physionomies exprimées dans le polygone (Fourré haut bas, Fourré haut etc.).'
        color: '#05bc77'
      - key: '4300'
        label: Fourré haut dense
        description: 'Physionomie dominée par une végétation d’arbustes et d’arbrisseaux de type nanophanérophytes. L’abondance des arbustes jointifs et l’absence de clairières herbacées correspondant à des stades dynamiques antérieurs persistants, donne une physionomie homogène. Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle est déduite de la physionomie ma-joritaire.'
        color: '#229c39'
      - key: '5100'
        label: Forêt pionnière
        description: 'Physionomie dominée par une végétation dont la strate arborescente est moyen-nement haute (7 à 15 m environ) et peu dense, de telle manière que la flore herba-cée du sous-bois et des milieux associés est peu différente de la flore des milieux ouverts.'
        color: '#095d2c'
      - key: '5200'
        label: Forêt mature de type indéterminée
        description: "Physionomie dominée par une végétation dont la strate arborescente est haute et dense, de telle manière que la flore herbacée du sous-bois, conditionnée par la faible luminosité et les autres paramètres du climat forestier, est très différente de la flore des milieux ouverts environnants. Pour ce poste physionomique, la nature précise du peuplement forestier (forêt mature naturelle à semi-naturelle ou plan-tation forestière) n'a pas été déterminée."
        color: '#4e6a0a'
      - key: '5210'
        label: Forêt mature naturelle de type indéterminé
        description: Forêt mature excluant les plantations pour laquelle la couverture majoritaire (par les résineux ou par les feuillus) n'a pas été déterminée.
        color: '#4e6a0a'
      - key: '5211'
        label: Forêt mature de résineux
        description: Forêt mature avec couverture majoritaire de résineux mais excluant les plantations
        color: '#07745d'
      - key: '5212'
        label: Forêt mature de feuillus
        description: Forêt mature avec couverture majoritaire de feuillus mais excluant les plantations
        color: '#487644'
      - key: '5220'
        label: Plantation forestière
        description: 'Physionomie liée à la plantation de ligneux assez denses, de plus de 5 m de haut.'
        color: '#5f5328'
      - key: '6000'
        label: Surface en eau
        description: Physionomie liée à la présence d'une lame d'eau libre pour laquelle il n'a pas été déterminé si elle était colonisée ou non par des végétations aquatiques et amphi-bies.
        color: '#6fdbeb'
      - key: '6100'
        label: Surface en eau végétalisée
        description: "Physionomie correspondant aux surfaces en eau présentant une végétation aqua-tique, à laquelle peut s'associer une végétation amphibie. Cette valeur n'est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle est déduite de la physionomie majoritaire"
        color: '#6ce2c5'
      - key: '6200'
        label: Surface en eau non végétalisée
        description: 'Physionomie correspondant aux surfaces d’eau sans végétation aquatique. Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle est déduite de la physionomie majoritaire.'
        color: '#30b6d4'
      - key: '7100'
        label: Autre culture permanente
        description: 'Culture permanente de plantes ligneuses autre que les vergers, vignobles et plan-tations forestières.'
        color: '#f8b80a'
      - key: '7200'
        label: Vergers
        description: Physionomie correspondant aux parcelles de vergers
        color: '#ed8d50'
      - key: '7300'
        label: Vignes
        description: Physionomie correspondant aux parcelles de vignobles
        color: '#8d5a99'
      - key: '8000'
        label: Culture annuelle ou prairie temporaire
        description: Physionomie correspondant aux cultures annuelles ou aux prairies retournées dans l'année.
        color: '#f8ef4a'
      - key: '8001'
        label: Prairie temporaire
        description: Prairie retournée dans l’année. Culture de fourrage à rotation pluriannuelle (semi et labour sont en général espacés de plusieurs années) ; une à plusieurs récoltes par an.
        color: '#ffff90'
      - key: '8002'
        label: Culture annuelle
        description: 'Physionomie liée à la présence de cultures herbacées annuelles, au sein desquelles la végétation adventice vivace et annuelle se développe de manière assez éparse. Cette valeur n’est codée que sur des polygones dont la physionomie majoritaire a été calculée par modélisation supervisée. Elle est déduite de la physionomie majoritaire.'
        color: '#f8ef4a'
    infer:
      http:
        needs: [start_at]
        granularities: { start_at: 1m }
        # coordsBox call has N (third param) set to 5 since rounding GPS coords
        # to 5th decimal gives approx. 1m of precision,
        # which we reflect in start_at's granularity
        select: |
          (
            $code := features[0].properties.code_hab_carhab;
            $split($code, "-")[0]
          )
        from: https://data.geopf.fr/wfs
          ?service=WFS
          &version=2.0.0
          &request=GetFeature
          &typenames=Carhab_habitat:habitats_carhab
          &bbox={{ coordsBox start_at.value.longitude start_at.value.latitude 5 }},EPSG:4326
          &outputformat=application/json
          &srsname=EPSG:4326

  habitat_photo:
    type: file
    label: Photo du milieu
    kobocollect: Prenez une photo du milieu
    description: Prenez une photo qui représente bien l'endroit où vous allez effectuer l'inventaire photographique.
    mergeMethod: none
    required: false
    accept:
      - image/*
    size:
      maximum: 10 MB
    infer:
      capture: before-timer

  soil_photo_start:
    type: file
    label: Sol au départ
    kobocollect: Prenez une photo du sol au point de départ du transect
    description: Prenez une photo du sol au point de départ du transect. Le téléphone/appareil doit être parallèle au sol, à hauteur d'hanche (environ 1 m du sol) afin d'analyser la communauté de plante
    mergeMethod: none
    required: false
    accept:
      - image/*
    size:
      maximum: 10 MB
    infer:
      capture: before-timer

  habitat_comment:
    type: string
    label: Commentaire sur le lieu
    kobocollect: Commentaire ou remarque sur le milieu
    required: false
    mergeMethod: none
    description: ''

  transect_code:
    type: string
    label: Code du transect
    description: |
      Le code du transect est composé de la date, de l'heure, et de vos initiales. Par exemple, un transect réalisé par Martin Galli le 07/12/2023 à 14h50 s'écrira : 202312071450MG
    mergeMethod: none
    required: true
    pattern: year, month, day, hours, minutes, uppercase letter minimum 2 times
    default: |
      {{ formatDate (metadata session "date") "yyyyMMddHHmm" }}

  wind_speed:
    type: float
    label: Vitesse du vent
    description: Si il y a du vent mais que sa vitesse est trop faible pour être détectée par votre anémomètre, indiquez 1 km/h
    # TODO: once https://github.com/jonahsnider/convert/issues/497 is resolved
    # implement speed units and use them here
    display:
      suffix: km/h
    mergeMethod: average
    required: false
    range: 1..30

  shadow_temperature:
    type: float
    label: Température à l'ombre
    kobocollect: Température à l'ombre (°C)
    unit: celsius
    description: Il faut s'assurer que la température mesurée soit bien celle de l'air à l'ombre et qu'elle soit influencé le moins possible par le soleil, par le sol ou par votre température corporelle. Si vous n'avez pas de thermomètre utilisez la température prédite par la météo locale
    mergeMethod: average
    required: true
    range: x ≤ 13

  grass_height:
    type: float
    label: Hauteur de la strate herbacée
    kobocollect: Hauteur de la strate herbacée (cm)
    unit: cm
    description: Estimez la hauteur de l'herbe sur votre transect. Si elle n'est pas constante estimez une moyenne sur les 20m du parcours prévu.
    mergeMethod: average
    required: true
    range: x ≤ 180

  incline:
    type: float
    label: Pente
    unit: deg
    description: Mesuré avec une application clinomètre, long côté du téléphone positionné parallèlement à la pente
    mergeMethod: average
    required: false
    range: 0..90

  # TODO: verif si c bien ça la trad anglaise
  incline_exposure:
    type: float
    label: Exposition (orientation) de la pente
    kobocollect: Exposition
    unit: deg
    description: Mesuré avec une application boussole, pointée vers le bas de la pente
    mergeMethod: average
    required: false
    range: 0..360

  on_path:
    type: boolean
    label: Chemin
    description: Le transect est-il réalisé depuis un chemin?
    kobocollect:
      list: Le transect est-il réalisé depuis un chemin ?
      true: oui
      false: non
    mergeMethod: average
    required: false

  start_at:
    type: location
    label: Point de départ
    description: |
      Dès que vous avez réussi à vous géolocaliser, c'est parti pour 20 minutes de safari macrophotographique! Laissez ou prenez un point de repère pour retrouver votre point de départ. Vous pouvez mettre le téléphone en veille et revenir sur ce questionnaire à la fin des 20min pour indiquer votre point d'arrivée et les 3 dernières questions. N'oubliez pas de lancer un chronomètre
    mergeMethod: none
    required: true
    infer:
      capture: before-timer

  end_at:
    type: location
    label: Point d'arrivée
    description: Les 20min sont écoulées. Enregistrez la localisation de votre point d'arrivé.
    mergeMethod: none
    required: true
    infer:
      capture: after-timer

  soil_photo_end:
    type: file
    label: Sol à l'arrivée
    kobocollect: Prenez une photo du sol au point d'arrivée du transect
    description: La photo doit être parallèle au sol, à hauteur d'hanche (environ 1 m du sol) afin d'analyser la communauté de plante
    required: false
    mergeMethod: none
    accept:
      - image/*
    size:
      maximum: 10 MB
    infer:
      capture: after-timer

  distance:
    type: float
    label: Distance parcourue
    kobocollect: Distance totale parcourue (m)
    unit: m
    required: true
    mergeMethod: average
    description: En revenant sur vos pas. Estimez en enjambées de 1 m la distance exact parcourue entre le point d'arrivée et le point de départ.
    range: x > 0
    # TODO: cascade from a surface-type metadata made from start_at and end_at, by taking its hypot

  camera_type:
    type: enum
    label: Type d'appareil photo
    kobocollect: Quel type d'appareil photo avez vous utilisez?
    description: ''
    required: true
    mergeMethod: none
    options:
      - key: smartphone
        label: Smartphone
      - key: with_macro
        kobocollect: reflex_ou_hybride_avec_objectif_macro_et
        label: Reflex ou hybride avec objectif macro et flash
      - key: compact
        label: Compact
      - key: without_macro
        kobocollect: reflex_ou_hybride_sans_objectif_macro
        label: Reflex ou hybride sans objectif macro
      - key: other
        kobocollect: autres
        label: Autre

  comment:
    type: string
    required: false
    description: ''
    label: Remarque ou commentaire
    mergeMethod: none

metadata:
  f_stop:
    label: Ouverture
    description: ''
    learnMore: https://fr.wikipedia.org/wiki/Ouverture_(photographie)
    type: float
    mergeMethod: average
    required: false
    range: x >= 0
    display:
      prefix: f/
    infer:
      exif: FNumber
  focal_length:
    label: Focale
    description: Longueur de focale, au format 35mm
    learnMore: https://fr.wikipedia.org/wiki/Distance_focale_%C3%A9quivalente_en_35_mm
    type: float
    unit: mm
    range: x >= 0
    mergeMethod: average
    required: false
    infer:
      exif: FocalLengthIn35mmFilm
  shutter_speed:
    label: Vitesse d'obturation
    description: Aussi appelé Durée d'exposition ou Temps de pose. _Shutter speed_ en anglais.
    learnMore: https://fr.wikipedia.org/wiki/Temps_de_pose
    type: float
    unit: seconds
    display:
      format: $fraction(1, value)
      parse: |
        $contains(value, "/")
          ? 1 / $number($split(value, "/")[1])
          : $number(value)
    range: x >= 0
    mergeMethod: average
    required: false
    infer:
      exif: ExposureTime
  iso:
    label: Sensibilité
    description: ''
    learnMore: https://fr.wikipedia.org/wiki/Sensibilité_ISO
    type: integer
    mergeMethod: average
    range: x >= 0
    display:
      prefix: 'ISO '
    required: false
    infer:
      exif: ISOSpeedRatings

  camera_brand:
    label: ''
    description: ''
    type: string
    mergeMethod: none
    required: false
    infer:
      exif: Make
  camera_model:
    label: ''
    description: ''
    type: string
    mergeMethod: none
    required: false
    infer:
      exif: Model

capture:
  timers:
    - name: Actif
      shoot: manually
      every: 30s
      during: 20min
      messages:
        lap: Faire un pas en avant
        status:
          - '{{ formatDurationStopwatch (increase total.remainingMs 1000) }}'
          - '{{ laps.doneCount }} pas / {{ decrease laps.totalCount 1 }}'
    - name: Passif
      shoot: on-timer
      count: 100
      during: 10min
      messages:
        status:
          - '{{ formatDurationStopwatch (increase total.remainingMs 1000) }}'
          - '{{ laps.doneCount }} photos / {{ laps.totalCount }}'

exports:
  images:
    mtime: shoot_date
    cropped: Cropped/{{ fallback image.protocolMetadata.species.valueLabel "(Unknown)" }}_obs{{ observation.number }}_{{ sequence }}.{{ extension image.filename }}
    original: Original/{{ fallback image.protocolMetadata.species.valueLabel "(Unknown)" }}_obs{{ observation.number }}_{{ sequence }}.{{ extension image.filename }}
  metadata:
    csv: metadata.csv
    files: Files/{{ sequence }}-{{ metadataKey }}.{{ extension filename }}
