# yaml-language-server: $schema=https://cigaleapp.github.io/cigale/protocol.schema.json
manifest: v1.0
id: fr.osug.terra-forma-web.opportunistic
name: Relevé opportuniste
summary: Pour des photos spontanées sans protocole strict
authors:
  - name: Maxime Cauchoix

version: 1
updates: automatic
source: https://raw.githubusercontent.com/cigaleapp/cigale/main/protocols/opportunistic.cigaleprotocol.yaml

description: ''

imports:
  - from: io.github.cigaleapp.base.insects
    metadataGroups:
      - taxonomy
    metadata:
      - species
      - identification_difficulty
      - conservation_status
      - shoot_date
      - shoot_location
      - crop
  - from: io.github.cigaleapp.base.environment
    sessionMetadata:
      - weather_condition
      - habitat

crop:
  metadata: crop

metadataGroups:
  habitat:
    name: Habitat
    description: ''
    metadata:
      - homogenous_habitat
      - carhab
      - zone

metadataOrder:
  # Session
  - date
  - start_at
  - strictness
  - wind
  - temperateure
  - cloud_coverage
  - shadowed_proportion
  - flash_used
  - end_at
  - duration
  - distance
  - homogenous_habitat
  - habitat
  - zone
  - weather_condition
  - comment
  # Observations
  - species
  - genus
  - family
  - order
  - class
  - phylum
  - kingdom
  - shoot_location
  - shoot_date
  - conservation_status
  - identification_difficulty

sessionMetadata:
  date:
    type: date
    label: Date de début
    mergeMethod: none
    required: true
    description: ''
    infer:
      capture: before-timer

  duration:
    type: 'integer'
    label: 'Durée de prospection'
    description: 'Durée de la prospection sur le terrain'
    unit: 'minutes'
    required: false
    mergeMethod: 'average'
    range: '> 0'

  distance:
    type: 'float'
    label: 'Distance parcourue'
    description: 'Distance parcourue sur le terrain'
    unit: 'meters'
    required: false
    mergeMethod: 'average'
    range: '> 0'

  homogenous_habitat:
    type: boolean
    label: Habitat homogène
    description: J'ai choisi un habitat homogène pour réaliser mon relevé (laisser vide si inconnu)
    required: false
    mergeMethod: none

  strictness:
    type: enum
    label: Exhaustivité du relevé
    description: J'ai photographié
    required: true
    mergeMethod: min
    default: at_will
    options:
      - key: all
        label: Tous les individus rencontrés
      - key: inventory
        label: Au moins un individu de chaque espèce rencontrée
      - key: at_will
        label: Juste quelques individus quand j'en avais envie

  wind:
    type: enum
    label: Vent
    description: Condition de vent pendant la prospection
    required: false
    mergeMethod: max
    options:
      - key: none
        label: Pas du tout
      - key: light
        label: Léger
      - key: moderate
        label: Modéré
      - key: strong
        label: Fort

  temperature:
    type: integer
    label: Température
    description: Température approximative pendant la prospection
    unit: celsius
    required: false
    mergeMethod: average
    range: '>= -273.15'

  cloud_coverage:
    type: enum
    label: Couverture nuageuse
    description: Condition de couverture nuageuse pendant la prospection
    required: false
    mergeMethod: max
    options:
      - key: clear
        label: Dégagé
      - key: 10_30_percent
        label: 10-30%
      - key: half
        label: 50%
      - key: more_than_half
        label: Plus de 50%
      - key: overcast
        label: Tout couvert

  shadowed_proportion:
    type: integer
    label: Photos à l'ombre
    description: Part des photos prises à l'ombre (en pourcentage)
    required: false
    mergeMethod: average
    range: 0..100

  camera_type:
    type: enum
    label: Type d’appareil photo
    description: Type d'appareil photo utilisé pour prendre les photos
    required: false
    mergeMethod: none
    options:
      - key: smartphone
        label: Smartphone
      - key: compact
        label: Appareil photo compact
      - key: dslr
        label: Appareil photo reflex (DSLR)
      - key: mirrorless
        label: Appareil photo hybride

  flash_used:
    type: boolean
    label: Flash utilisé
    description: Le flash de l'appareil photo a-t-il été utilisé pour prendre des photos ?
    required: false
    mergeMethod: max

  start_at:
    type: location
    label: Point de départ
    description: ''
    mergeMethod: none
    required: true
    infer:
      capture: before-timer

  zone:
    type: surface
    label: Zone
    description: Zone prospectée
    mergeMethod: none
    required: false

  # end_at:
  #   type: location
  #   label: Point d'arrivée
  #   description: Les 20min sont écoulées. Enregistrez la localisation de votre point d'arrivé.
  #   mergeMethod: none
  #   required: true
  #   infer:
  #     capture: after-timer

  comment:
    type: string
    required: false
    description: ''
    label: Remarque ou commentaire
    mergeMethod: none

metadata:
  f_stop:
    label: Ouverture
    description: ''
    learnMore: https://fr.wikipedia.org/wiki/Ouverture_(photographie)
    type: float
    mergeMethod: average
    required: false
    range: x >= 0
    display:
      prefix: f/
    infer:
      exif: FNumber
  focal_length:
    label: Focale
    description: Longueur de focale, au format 35mm
    learnMore: https://fr.wikipedia.org/wiki/Distance_focale_%C3%A9quivalente_en_35_mm
    type: float
    unit: mm
    range: x >= 0
    mergeMethod: average
    required: false
    infer:
      exif: FocalLengthIn35mmFilm
  shutter_speed:
    label: Vitesse d'obturation
    description: Aussi appelé Durée d'exposition ou Temps de pose. _Shutter speed_ en anglais.
    learnMore: https://fr.wikipedia.org/wiki/Temps_de_pose
    type: float
    unit: seconds
    display:
      format: $fraction(1, value)
      parse: |
        $contains(value, "/")
          ? 1 / $number($split(value, "/")[1])
          : $number(value)
    range: x >= 0
    mergeMethod: average
    required: false
    infer:
      exif: ExposureTime
  iso:
    label: Sensibilité
    description: ''
    learnMore: https://fr.wikipedia.org/wiki/Sensibilité_ISO
    type: integer
    mergeMethod: average
    range: x >= 0
    display:
      prefix: 'ISO '
    required: false
    infer:
      exif: ISOSpeedRatings

  camera_brand:
    label: ''
    description: ''
    type: string
    mergeMethod: none
    required: false
    infer:
      exif: Make
  camera_model:
    label: ''
    description: ''
    type: string
    mergeMethod: none
    required: false
    infer:
      exif: Model

exports:
  images:
    mtime: shoot_date
    cropped: Cropped/{{ fallback image.protocolMetadata.species.valueLabel "(Unknown)" }}_obs{{ observation.number }}_{{ sequence }}.{{ extension image.filename }}
    original: Original/{{ fallback image.protocolMetadata.species.valueLabel "(Unknown)" }}_obs{{ observation.number }}_{{ sequence }}.{{ extension image.filename }}
  metadata:
    csv: metadata.csv
    files: Files/{{ sequence }}-{{ metadataKey }}.{{ extension filename }}
