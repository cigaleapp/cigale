    learnMore: https://open-meteo.com/en/docs#weather_variable_documentation
    mergeMethod: none
    required: false
    options:
      - key: '0'
        label: 'Ciel dégagé'
        icon: ri:sun-line
      - key: '1'
        label: 'Principalement dégagé'
        icon: ri:sun-line
      - key: '2'
        label: 'Partiellement nuageux'
        icon: ri:sun-cloudy-line
      - key: '3'
        label: 'Couvert'
        icon: ri:cloudy-line
      - key: '48'
        label: 'Brouillard'
        icon: ri:foggy-line
      - key: '45'
        label: 'Brouillard givrant'
        icon: ri:foggy-line
      - key: '51'
        label: 'Bruine légère'
        icon: ri:mist-line
      - key: '53'
        label: 'Bruine modérée'
        icon: ri:mist-line
      - key: '55'
        label: 'Bruine dense'
        icon: ri:mist-line
      - key: '56'
        label: 'Bruine verglaçante légère'
        icon: ri:mist-line
      - key: '57'
        label: 'Bruine verglaçante dense'
        icon: ri:mist-line
      - key: '61'
        label: 'Pluie légère'
        icon: ri:showers-line
      - key: '63'
        label: 'Pluie modérée'
        icon: ri:showers-line
      - key: '65'
        label: 'Pluie forte'
        icon: ri:heavy-showers-line
      - key: '66'
        label: 'Pluie verglaçante légère'
        icon: ri:showers-line
      - key: '67'
        label: 'Pluie verglaçante forte'
        icon: ri:heavy-showers-line
      - key: '71'
        label: 'Chute de neige légère'
        icon: ri:snowy-line
      - key: '73'
        label: 'Chute de neige modérée'
        icon: ri:snowy-line
      - key: '75'
        label: 'Chute de neige forte'
        icon: ri:snowflake
      - key: '77'
        label: 'Grains de neige'
      - key: '80'
        label: 'Averses de pluie légères'
        icon: ri:snowflake
      - key: '81'
        label: 'Averses de pluie modérées'
        icon: ri:showers-line
      - key: '82'
        label: 'Averses de pluie violentes'
        icon: ri:heavy-showers-line
      - key: '85'
        label: 'Averses de neige légères'
        icon: ri:snowy-line
      - key: '86'
        label: 'Averses de neige fortes'
        icon: ri:snowy-line
      - key: '95'
        label: 'Orage léger ou modéré'
        icon: ri:thunderstorms-line
      - key: '96'
        label: 'Orage avec grêle légère'
        icon: ri:thunderstorms-line
      - key: '99'
        label: 'Orage avec grêle forte'
        icon: ri:thunderstorms-line
    infer:
      http:
        needs: [start_at, date]
        granularities:
          start_at: 1km
          date: hour

        from: https://archive-api.open-meteo.com/v1/archive
          ?latitude={{ round start_at.value.latitude 4 }}
          &longitude={{ round start_at.value.longitude 4 }}
          &start_date={{ formatDate date.value "yyyy-MM-dd" }}
          &end_date={{ formatDate date.value "yyyy-MM-dd" }}
          &format=json
          &hourly=weather_code

        select: |
          (
            $by_time := $zip(hourly.time, hourly.weather_code){ $[0]: $[1] };

            metadata.date.value 
            ~> $roundDate(?, "hour") 
            ~> $formatDate(?, "yyyy-MM-dd'T'HH:mm") 
            ~> $lookup($by_time, ?) 
            ~> $string
          )

  start_at:
    type: location
    label: Point de départ
    description: ''
    mergeMethod: none
    required: true
    infer:
      capture: before-timer

  zone:
    type: surface
    label: Zone
    description: Zone prospectée
    mergeMethod: none
    required: false


  # end_at:
  #   type: location
  #   label: Point d'arrivée
  #   description: Les 20min sont écoulées. Enregistrez la localisation de votre point d'arrivé.
  #   mergeMethod: none
  #   required: true
  #   infer:
  #     capture: after-timer

  comment:
    type: string
    required: false
    description: ''
    label: Remarque ou commentaire
    mergeMethod: none

metadata:
  f_stop:
    label: Ouverture
    description: ''
    learnMore: https://fr.wikipedia.org/wiki/Ouverture_(photographie)
    type: float
    mergeMethod: average
    required: false
    range: x >= 0
    display:
      prefix: f/
    infer:
      exif: FNumber
  focal_length:
    label: Focale
    description: Longueur de focale, au format 35mm
    learnMore: https://fr.wikipedia.org/wiki/Distance_focale_%C3%A9quivalente_en_35_mm
    type: float
    unit: mm
    range: x >= 0
    mergeMethod: average
    required: false
    infer:
      exif: FocalLengthIn35mmFilm
  shutter_speed:
    label: Vitesse d'obturation
    description: Aussi appelé Durée d'exposition ou Temps de pose. _Shutter speed_ en anglais.
    learnMore: https://fr.wikipedia.org/wiki/Temps_de_pose
    type: float
    unit: seconds
    display:
      format: $fraction(1, value)
      parse: |
        $contains(value, "/")
          ? 1 / $number($split(value, "/")[1])
          : $number(value)
    range: x >= 0
    mergeMethod: average
    required: false
    infer:
      exif: ExposureTime
  iso:
    label: Sensibilité
    description: ''
    learnMore: https://fr.wikipedia.org/wiki/Sensibilité_ISO
    type: integer
    mergeMethod: average
    range: x >= 0
    display:
      prefix: 'ISO '
    required: false
    infer:
      exif: ISOSpeedRatings

  camera_brand:
    label: ''
    description: ''
    type: string
    mergeMethod: none
    required: false
    infer:
      exif: Make
  camera_model:
    label: ''
    description: ''
    type: string
    mergeMethod: none
    required: false
    infer:
      exif: Model

exports:
  images:
    mtime: shoot_date
    cropped: Cropped/{{ fallback image.protocolMetadata.species.valueLabel "(Unknown)" }}_obs{{ observation.number }}_{{ sequence }}.{{ extension image.filename }}
    original: Original/{{ fallback image.protocolMetadata.species.valueLabel "(Unknown)" }}_obs{{ observation.number }}_{{ sequence }}.{{ extension image.filename }}
  metadata:
    csv: metadata.csv
    files: Files/{{ sequence }}-{{ metadataKey }}.{{ extension filename }}
