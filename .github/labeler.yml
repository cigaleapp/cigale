android-native-changes:
  - changed-files:
      - any-glob-to-any-file: [android/*, .github/workflows/android.yml]
  - head-branch:
      - renovate/capacitor-.*
      - renovate/capawesome-.*
      - renovate/capgo-.*

ios-native-changes:
  - changed-files:
      - any-glob-to-any-file: [ios/*]
  - head-branch:
      - renovate/capacitor-.*
      - renovate/capawesome-.*
      - renovate/capgo-.*

notifications-off:
  - head-branch:
      - renovate/*

bypass:e2e:
  - head-branch:
      - renovate/eslint-*
      - renovate/oxlint-*
      - renovate/knip-*
      - renovate/prettier-*
      - renovate/lint-staged-*
      - renovate/svelte-check-*
      - renovate/typescript-eslint-*
