name: Build and publish dev deployments server image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: 
      - .github/workflows/dev-deployments-server-image.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cigaleapp/dev-deployments-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create dockerfile
        run: |
          cat > Dockerfile.caddy <<'EOF'
            FROM caddy:2.10.2-builder AS builder
            RUN xcaddy build --with github.com/sagikazarmark/caddy-fs-s3@v0.12.0
            FROM caddy:2.10.2
            COPY --from=builder /usr/bin/caddy /usr/bin/caddy
          EOF

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.caddy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
