name: Renovate PRs postupgrade

on:
  pull_request:
    types: [opened, synchronize, labeled]
    # The 'branches' option filters on the *base* branch, not the head...
    # See https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#running-your-pull_request-workflow-based-on-the-head-or-base-branch-of-a-pull-request

concurrency: 
  group: renovate-postupgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  is-renovate:
    name: Is it a renovate PR?
    runs-on: ubuntu-latest
    if: contains(github.head_ref, 'renovate/')
    steps:
      - run: echo OK
  capacitor:
    name: Capacitor-related tasks
    runs-on: ubuntu-latest
    needs: is-renovate
    if: contains(github.event.pull_request.labels.*.name, 'android-native-changes')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ssh-key: ${{ secrets.AUTOCOMMITS_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump native code version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr diff ${{ github.event.pull_request.number }} --name-only | grep "^android/.native-code-version$"; then
            echo already bumped
            exit 0
          fi
          current=$(cat android/.native-code-version)
          echo Native code version is currently $current
          echo "It'll be set to $(( current + 1))"
          echo $(( current + 1 )) > android/.native-code-version

      - name: Run cap update
        # Can't use bun cap update because generated files are missing without first build.
        # So we shim an empty built webapp (just index.html) and run cap sync instead
        run: |
          mkdir public
          echo hello > public/index.html
          bun cap sync

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 📦 Update native code
          file_pattern: ios/ android/
