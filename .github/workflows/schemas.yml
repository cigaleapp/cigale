name: Schemas

on:
  workflow_call:
    inputs: {}

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        schemas: [prod, local]
        protocols: [prod, local]

    name: Check ${{ matrix.protocols }} protocols against ${{ matrix.schemas }} schemas
    steps:
      - if: matrix.protocols == 'local'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.protocols == 'prod'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - if: matrix.schemas == 'local'
        name: Generate JSON schema
        run: bun run scripts/generate-json-schemas.js
      - if: matrix.schemas == 'prod'
        name: Download protocols schema
        run: wget https://cigaleapp.github.io/cigale/protocol.schema.json -O static/protocol.schema.json

      - name: Validate protocols with JSON schema
        uses: GrantBirki/json-yaml-validate@9dbc6e6ff950c53200156e8afbc16ef1355f1c8d # v5.0.1
        with:
          json_schema: static/protocol.schema.json
          json_schema_version: draft-2020-12
          files: |
            **/*.cigaleprotocol.{yaml,json}
