name: Protocols server

on:
  schedule:
    # Runs at 00:00 UTC every Monday and Thursday (same as the old workflow)
    - cron: 0 0 * * 1,4
  workflow_dispatch:
  pull_request:
    paths:
      - protocols-server/**
      - examples/*.cigaleprotocol.json
      - .github/workflows/protocols.yml
  push:
    branches: [main]
    paths:
      - protocols-server/**
      - examples/*.cigaleprotocol.json
      - .github/workflows/protocols.yml

concurrency:
  group: protocols-server
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cigaleapp/protocols-server
  HF_ENV: biodimedia
  HF_APP: cigale-protocols

jobs:
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for relevant changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            protocols:
              - 'protocols-server/**'
              - 'examples/*.cigaleprotocol.json'
              - '.github/workflows/protocols.yml'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.protocols == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: (steps.changes.outputs.protocols == 'true' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        if: steps.changes.outputs.protocols == 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # needed for the docker image
      - name: Generate JSON schemas
        run: bun run scripts/generate-json-schemas.js

      - name: Build and push image
        if: steps.changes.outputs.protocols == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: protocols-server/Dockerfile
          # XXX: DONT MERGE
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        if: steps.changes.outputs.protocols == 'true' || github.event_name == 'workflow_dispatch'
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Restart app and regenerate
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name != 'pull_request' && (needs.build-image.outputs.image != '' || github.event_name == 'schedule')

    env:
      IMAGE: ${{ needs.build-image.outputs.image }}

    steps:
      - name: Setup hfctl
        uses: nudibranches-tech/setup-hfctl@v1
        with:
          service-account: ${{ secrets.HYPERFLUID_SERVICE_ACCOUNT }}

      - name: Update app image
        if: env.IMAGE != ''
        run: |
          hfctl -e "$HF_ENV" apps update "$HF_APP" --image "$IMAGE" --wait

      - name: Restart app
        if: env.IMAGE == ''
        run: |
          hfctl -e "$HF_ENV" apps restart "$HF_APP"

      - name: Wait for app to be ready
        run: |
          hfctl -e "$HF_ENV" apps get "$HF_APP" --watch --wait-timeout 300

      - name: Resolve app URL
        id: app
        run: |
          # Prefer an explicit URL if one is configured; otherwise read the
          # public route from the app status.
          if [ -n "$PROTOCOLS_APP_URL" ]; then
            url="$PROTOCOLS_APP_URL"
          else
            url=$(hfctl -e "$HF_ENV" apps get "$HF_APP" -o json \
              | jq -r '[.url, .webUrl, .status.url, .status.webUrl] | map(select(. != null and . != "")) | first // empty')
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine the public URL of app $HF_APP. Set the PROTOCOLS_APP_URL secret."
            exit 1
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "App URL: $url"
        env:
          PROTOCOLS_APP_URL: ${{ secrets.PROTOCOLS_APP_URL }}

      - name: Wait for regeneration to finish
        run: |
          echo "Waiting for options regeneration to complete..."
          for i in $(seq 1 120); do
            status=$(curl -fsS "$APP_URL/api/regenerate" | jq -r '.state')
            echo "[$i/120] state: $status"
            if [ "$status" = "done" ] || [ "$status" = "error" ]; then
              break
            fi
            sleep 30
          done
          echo "Final status:"
          curl -fsS "$APP_URL/api/regenerate" | jq .
        env:
          APP_URL: ${{ steps.app.outputs.url }}

      - name: Show recent logs
        if: always()
        run: |
          hfctl -e "$HF_ENV" apps logs "$HF_APP" --tail 50 || true
