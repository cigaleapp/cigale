name: Protocols server

on:
  schedule:
    # Runs at 00:00 UTC every Monday and Thursday (same as the old workflow)
    - cron: 0 0 * * 1,4
  workflow_dispatch:
  pull_request:
    paths:
      - protocols-server/**
      - protocols/**
      - .github/workflows/protocols.yml
  push:
    branches: [main]
    paths:
      - protocols-server/**
      - protocols/**
      - .github/workflows/protocols.yml

concurrency:
  group: protocols-server
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cigaleapp/protocols-server
  HF_ENV: biodimedia
  HF_APP: cigale-protocols

jobs:
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for relevant changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            protocols:
              - 'protocols-server/**'
              - 'protocols/**'
              - '.github/workflows/protocols.yml'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.ref_name }},enable=true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # needed for the docker image
      - name: Generate JSON schemas
        run: bun run scripts/generate-json-schemas.js

      - name: Build and push image
        if: steps.changes.outputs.protocols == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: protocols-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Restart app and regenerate
    runs-on: ubuntu-latest
    needs: build-image
    # XXX: DONT MERGE
    # if: github.event_name != 'pull_request' && github.event_name == 'schedule'

    permissions:
      contents: read
      checks: write

    steps:
      - name: Record job start time
        id: jobstart
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup hfctl
        uses: nudibranches-tech/setup-hfctl@v1
        with:
          console-url: https://data-terra.ai.meso.umontpellier.fr
          service-account: ${{ secrets.DATATERRA_HF_SERVICE_ACCOUNT }}

      - name: Restart app
        run: |
          hfctl -e "$HF_ENV" apps restart "$HF_APP"

      - name: Wait for app to be ready
        run: |
          hfctl -e "$HF_ENV" apps get "$HF_APP" --watch --wait-timeout 300

      - name: Resolve app URL
        id: app
        run: |
          # Prefer an explicit URL if one is configured; otherwise read the
          # public route from the app status.
          if [ -n "$PROTOCOLS_APP_URL" ]; then
            url="$PROTOCOLS_APP_URL"
          else
            url=$(hfctl -e "$HF_ENV" apps get "$HF_APP" -o json | jq -r .endpoint)
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine the public URL of app $HF_APP. Set the PROTOCOLS_APP_URL secret."
            exit 1
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "App URL: $url"
        env:
          PROTOCOLS_APP_URL: ${{ secrets.PROTOCOLS_APP_URL }}
          
          - name: Wait for regeneration to finish
          working-directory: protocols-server
          run: bun run wait-server-regen
          env:
            SERVER_URL: ${{ steps.app.outputs.url }}
            SERVER_PASSWORD: ${{ secrets.DATATERRA_PROTOCOLS_SERVER_PASSWORD }}
            JOB_STARTED_AT: ${{ steps.jobstart.outputs.started_at }}
            TOTAL_WAIT_MINUTES: 120
            GH_TOKEN: ${{ github.token }}

      - name: Show recent logs
        if: always()
        run: |
          hfctl -e "$HF_ENV" apps logs "$HF_APP" --tail 50 || true
