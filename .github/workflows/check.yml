name: Checks

on:
  pull_request:
    types: [opened, synchronize, closed, converted_to_draft, ready_for_review, unlabeled, labeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notify-start:
    if: contains(github.event.pull_request.labels.*.name, 'notifications-noisy')
    name: Send push notification on workflow started
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Push notification
        uses: ./.github/actions/notify
        with:
          api_base_url: ${{ secrets.GOTIFY_API_BASE_URL }}
          token: ${{ secrets.GOTIFY_APP_TOKEN }}
          title: "🛫 PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }}) is starting mergeability checks"
          message: Checks started
          url: https://${{ github.server }}/${{ github.repo }}/pull/${{ github.event.pull_request.number }}
  
  db-revision:
    name: Database revision is not decreased
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/number-change
        id: change
        with:
          file: src/lib/idb.svelte.js
          lhs: export const databaseRevision =
      - run: |
          if [[ "${{ steps.change.outputs.decreased }}" = "false" ]]; then
            exit 0
          else
            echo Database revision was decreased
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  json-schema:
    name: Validate JSONs
    uses: ./.github/workflows/schemas.yml

  clutter:
    name: Check for clutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check for clutter
        run: bun knip --reporter github-actions

  build:
    name: Build (production)
    uses: ./.github/workflows/build.yml
    with:
      debug: false

  build-github-pages:
    if: github.event_name == 'push' && github.ref_name == 'main'
    name: Build (GitHub Pages)
    uses: ./.github/workflows/build.yml
    with:
      debug: false
      github-pages: true

  test:
    needs: lint
    name: Unit tests
    uses: ./.github/workflows/vitest.yml
    secrets: inherit
    with:
      compare-coverage: ${{ github.event_name == 'pull_request' }}

  build-debug:
    # Run on PRs (only if not in draft) or on other events
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'unminified-preview')
    name: Build (debug)
    uses: ./.github/workflows/build.yml
    with:
      debug: true

  e2e-concurrency:
    name: Compute E2E concurrency bucket
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.bucket.outputs.bucket }}
    steps:
      - name: Compute bucket from run number
        id: bucket
        run: |
          bucket=$(( (RUN_NUMBER + RUN_ATTEMPT) % 4 ))
          echo "Computed bucket: $bucket"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}

  e2e:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'speedy-e2e') }}
    needs: [build-debug, json-schema, lint, test, e2e-concurrency]
    name: E2E
    concurrency:
      group: playwright-${{ needs.e2e-concurrency.outputs.bucket }}
      queue: max
    uses: ./.github/workflows/playwright.yml
    secrets: inherit
    with:
      artifact: ${{ needs.build-debug.outputs.artifact }}

  e2e-speedy:
    if: contains(github.event.pull_request.labels.*.name, 'speedy-e2e')
    needs: [build-debug]
    name: E2E (Speedy)
    concurrency:
      group: playwright-speedy-${{ github.event.pull_request.number }}
      queue: single
    uses: ./.github/workflows/playwright.yml
    secrets: inherit
    with:
      artifact: ${{ needs.build-debug.outputs.artifact }}

  bundlesize:
    if: github.ref_name != 'main'
    needs: test
    name: Bundle size
    uses: ./.github/workflows/bundlesize.yml
    secrets: inherit

  preview:
    if: github.event_name == 'pull_request' && !failure() && !cancelled()
    needs: [build, build-debug, json-schema]
    name: PR Preview
    uses: ./.github/workflows/preview.yml
    secrets: inherit
    with:
      artifact: ${{ contains(github.event.pull_request.labels.*.name, 'unminified-preview') && needs.build-debug.outputs.artifact || needs.build.outputs.artifact }}

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [build-github-pages, e2e, dont-merge-comment]
    name: Deploy
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: true
    uses: ./.github/workflows/deploy.yml
    with:
      artifact: ${{ needs.build-github-pages.outputs.artifact }}
      notify: ${{ includes(github.event.head_commit.message, '/notify') || includes(github.event.head_commit.message, '🚑') || includes(github.event.head_commit.message, ':ambulance:') }}

  check-native-version:
    if: contains(github.event.pull_request.labels.*.name, 'android-native-changes')
    name: Ensure native code version bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Get native code version change
        id: version
        uses: ./.github/actions/number-change
        with:
          file: android/.native-code-version
          lhs: ''

      - name: Verify that it changed
        run: |
          if [[ "${{ steps.version.outputs.changed }}" == "true" ]]; then
            exit 0
          else
            echo "android/.native-code-version didn't change!!"
            exit 1
          fi

  dont-merge-comment:
    name: Check for presence of "do not merge" comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          # Check for "do not merge" comment in the codebase
          if git grep -q "$prefix: $message"; then
            echo "Found "$prefix: $message" in source code. Failing the job."
            exit 1
          else
            echo "No "$prefix: $message" found in source code."
          fi
        env:
          prefix: XXX
          message: DONT MERGE

  is-mergeable:
    if: github.event_name == 'pull_request' && !cancelled()
    name: Mergeable?
    needs:
      - db-revision
      - build
      - json-schema
      - lint
      - test
      - e2e
      - clutter
      - preview
      - bundlesize
      - dont-merge-comment
      - check-native-version
    runs-on: ubuntu-latest
    steps:
      - if: needs.test.outputs.coverage-check == 'fail'
        run: echo "Coverage comparison did not pass the check"; exit 1
      - if: needs.e2e.result != 'success'
        run: echo "E2E tests (non-speedy) were not successful (skipped/cancelled/failed), cannot merge"; exit 1
      - if: contains(needs.*.result, 'failure')
        run: echo "Some tests failed :'("; exit 1
      - if: ${{ !contains(needs.*.result, 'failure') }}
        run: echo "All checks passed! This PR is mergeable :D"

  nightly-apk:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [build, test]
    name: Nightly APK
    uses: ./.github/workflows/android.yml
    secrets:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_PROD_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PROD_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_PROD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PROD_KEYSTORE_PASSWORD }}
      DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
      DEV_DEPLOYMENTS_SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOYMENTS_SSH_PRIVATE_KEY }}
      DEV_DEPLOYMENTS_HOST_KEY: ${{ secrets.DEV_DEPLOYMENTS_HOST_KEY }}
    with:
      push-update: true
      flavor: nightly
      artifact: ${{ needs.build.outputs.artifact }}
      app-name: Cigale Dev
      diawi-comment: |
        This is a nightly build from the ${{ github.ref_name }} branch.

        Branch: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}

  apk-webpage:
    if: github.event_name == 'push' && github.ref_name == 'main'
    name: Prepare APK webpage
    needs: [deploy, nightly-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve APK file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.nightly-apk.outputs.artifact }}

      - name: Save artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-webpage
          path: cigale.apk

  apk-webpage-deploy:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: apk-webpage
    name: Upload latest APK to dev deployments
    uses: ./.github/workflows/dev-deploy.yml
    secrets: inherit
    with:
      live-check: false
      clear: false
      environment: APK Download Page
      artifact: apk-webpage
      path: /
      subdomain: apk

  notify:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'notifications-off') && !github.event.pull_request.draft && !cancelled()
    name: Push with Gotify
    needs:
      - lint
      - test
      - e2e
      - is-mergeable
      - dont-merge-comment

    env:
      TITLE: '👀 PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }}) checks finished'
      MESSAGE: 'No further information available'
      URL: ${{ github.event.pull_request._links.html.href }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - if: needs.lint.result == 'failure'
        run: echo "MESSAGE=Linting failed" >> $GITHUB_ENV
      - if: needs.test.result == 'failure'
        run: echo "MESSAGE=Unit tests failed" >> $GITHUB_ENV
      - if: needs.e2e.result == 'failure'
        run: |
          echo "MESSAGE=E2E: ${{ needs.e2e.outputs.failed }} failed, ${{ needs.e2e.outputs.flaky }} flaky, ${{ needs.e2e.outputs.total }} total" >> $GITHUB_ENV
          echo "URL=https://pleye.gwen.works/${{ github.repo }}/branches/${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
      - if: needs.dont-merge-comment.result == 'failure'
        run: echo "MESSAGE=Code has don't merge comments" >> $GITHUB_ENV
      - if: needs.is-mergeable.result == 'success'
        run: |
          echo "TITLE=💚 PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }}) is mergeable!" >> $GITHUB_ENV
      - if: needs.is-mergeable.result != 'success'
        run: |
          echo "TITLE=💔 PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }}) cannot be merged :(" >> $GITHUB_ENV

      - name: Push notification
        uses: ./.github/actions/notify
        if: github.event_name == 'pull_request' && always() && !contains(github.event.pull_request.labels.*.name, 'notifications-off') && !github.event.pull_request.draft
        with:
          api_base_url: ${{ secrets.GOTIFY_API_BASE_URL }}
          token: ${{ secrets.GOTIFY_APP_TOKEN }}
          title: ${{ env.TITLE }}
          message: ${{ env.MESSAGE }}
          url: ${{ env.URL }}
