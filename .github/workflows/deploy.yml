name: Github Pages

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
        description: The build artifact name to deploy (output from the build workflow)
      notify:
        type: boolean
        default: false
        description: Send a push notification when deployment finished

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: public # The folder the action should deploy.
          force: true
          single-commit: true
          clean-exclude: |
            .nojekyll
            _pullrequests
            _playwright
            _vitest
            _coverage
            _nodemodules
            playwright.json

      - name: Push notification
        uses: ./.github/actions/notify
        if: inputs.notify
        with:
          title: 🚀 Deployed commit to prod
          message: ${{ github.event.head_commit.message }}
          url: https://cigaleapp.github.io/cigale/
