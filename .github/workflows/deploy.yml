name: Github Pages

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
        description: The build artifact name to deploy (output from the build workflow)
      notify:
        type: boolean
        default: false
        description: Send a push notification when deployment finished

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: public # The folder the action should deploy.
          force: true
          single-commit: true
          clean-exclude: |
            .nojekyll
            _pullrequests
            _playwright
            _vitest
            _coverage
            _nodemodules
            playwright.json

      - name: Wait for it to be live
        env:
          URL: https://cigaleapp.github.io/cigale/
        run: |
          string="<!-- COMMIT: ${{ github.sha }} -->"

          echo "Checking if '$string' is in reponse at $URL"
          touch index.html
          curl -fsSL $URL > index.html || echo curl error
          while ! grep -F "$string" index.html; do
            echo "Deployment not live yet, waiting..."
            sleep 5
            rm index.html
            touch index.html
            curl -fsSL $URL > index.html || echo curl error
          done

      - name: Push notification
        uses: ./.github/actions/notify
        if: inputs.notify
        with:
          api_base_url: ${{ secrets.GOTIFY_API_BASE_URL }}
          token: ${{ secrets.GOTIFY_APP_TOKEN }}
          title: 🚀 Deployed commit to prod
          message: ${{ github.event.head_commit.message }}
          url: https://cigaleapp.github.io/cigale/
