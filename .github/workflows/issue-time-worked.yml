name: Time spent

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, closed]
  push:
    branches: [main]
    paths:
      - .github/workflows/issue-time-worked.yml
      - scripts/github-issue-set-time-worked.ts
  schedule:
    # Run at end of work hours for morning & afternoon
    - cron: '0 12 * * *'
      timezone: Europe/Paris
    - cron: '0 19 * * *'
      timezone: Europe/Paris

jobs:
  compute:
    name: Compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Theres a bug where it doesnt use the lockfile's package versions
      # when doing auto-installs and uses latest anyways... so we have to install
      # see https://github.com/oven-sh/bun/issues/43977
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run script
        run: bun scripts/github-issue-set-time-worked.ts
        env:
          WAKATIME_API_KEY: ${{ secrets.GWENNLBH_WAKATIME_API_KEY }}
          WAKATIME_PROJECT: cigale
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXTRA_PROJECTS:
            | # Format is <cigale branch>:<other wakatime project name>@<other wakatime project's branch>
            generic-binary-storage:idb-opfs@master
            generic-binary-storage:playwright@storagestate-opfs
            fix-exif-orientation2:exiv2-wasm@main
            parallelworkers:swarpc@loadbalancer
            offthread:swarpc@main
            resultspage:cigale@moveprotocoleditpages
